<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pageTitle">حجز جلسة - أخصائية نفسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #9c6f70;
            --primary-hover: #835b5c;
            --secondary-color: rgba(245, 235, 234, 0.88);
            --text-main: #4a3f3e;
            --card-bg: rgba(255, 255, 255, 0.92);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            position: relative;
            background-color: #fcf9f8;
            overflow-x: hidden;
        }

        /* طبقات عرض الصور كخلفية متلاشية */
        .bg-slider {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            overflow: hidden;
        }

        .bg-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }

        .bg-slide.active {
            opacity: 1;
        }

        /* طبقة تعتيم لونية هادئة لعزل الصورة وتوضيح النصوص */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, rgba(252, 249, 248, 0.82), rgba(243, 230, 229, 0.78));
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: -1;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 25px 20px 60px;
            position: relative;
            z-index: 1;
        }

        /* شريط تغيير اللغة */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 25px;
        }

        .lang-select {
            padding: 9px 18px;
            border: 1px solid var(--primary-color);
            border-radius: 25px;
            background-color: rgba(255, 255, 255, 0.95);
            color: var(--primary-color);
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            cursor: pointer;
            outline: none;
            box-shadow: 0 4px 12px rgba(156, 111, 112, 0.12);
            transition: all 0.3s ease;
        }

        .lang-select:hover {
            background-color: #fff;
            transform: translateY(-1px);
        }

        .hero {
            text-align: center;
            padding: 45px 25px;
            background-color: var(--secondary-color);
            border-radius: 24px;
            margin-bottom: 35px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .hero h1 {
            color: var(--primary-color);
            margin: 0 0 12px;
            font-size: 1.9em;
            line-height: 1.4;
        }

        .hero p {
            font-size: 1.15em;
            color: #6d5b5a;
            margin: 0;
        }

        .booking-section {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        .booking-section h2 {
            color: var(--primary-color);
            text-align: center;
            margin: 0 0 15px;
            font-size: 1.7em;
        }

        .booking-section .section-desc {
            text-align: center;
            margin-bottom: 35px;
            color: #7a6a69;
            font-size: 1.05em;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #554443;
        }

        .form-group input, 
        .form-group textarea, 
        .form-group select {
            width: 100%;
            padding: 13px 16px;
            border: 1.5px solid #ecdcdb;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            background-color: rgba(255, 255, 255, 0.85);
            font-size: 0.95em;
            color: var(--text-main);
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .form-group input:focus, 
        .form-group textarea:focus, 
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(156, 111, 112, 0.12);
        }

        .submit-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 16px 30px;
            width: 100%;
            font-size: 1.15em;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(156, 111, 112, 0.25);
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(156, 111, 112, 0.35);
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
                gap: 0;
            }
            .booking-section {
                padding: 25px 20px;
            }
            .hero {
                padding: 30px 15px;
            }
            .hero h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>

    <!-- الخلفيات الثلاث مع التبديل التلقائي الهادئ -->
    <div class="bg-slider">
        <div class="bg-slide active" style="background-image: url('1.jpg');"></div>
        <div class="bg-slide" style="background-image: url('2.jpg');"></div>
        <div class="bg-slide" style="background-image: url('3.jpg');"></div>
    </div>
    <div class="bg-overlay"></div>

    <div class="container">
        <!-- شريط تغيير اللغة -->
        <div class="top-bar">
            <select class="lang-select" onchange="changeLanguage(this.value)">
                <option value="ar">العربية</option>
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="es">Español</option>
            </select>
        </div>

        <header class="hero">
            <h1 data-i18n="heroTitle">أهلاً بك في فضائك الآمن للاستماع والدعم</h1>
            <p data-i18n="heroSubtitle">أرافقك بكل لطف في فهم نفسك وما تمر به.</p>
        </header>

        <section class="booking-section">
            <h2 data-i18n="formTitle">حجز جلسة</h2>
            <p class="section-desc" data-i18n="formDesc">يُرجى تعبئة الاستمارة أدناه لإرسال طلب الحجز، وسيتصل بكم فريقنا لتأكيد حجزكم.</p>
            
            <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
                <div class="form-grid">
                    <div class="form-group">
                        <label data-i18n="labelName">الاسم واللقب *</label>
                        <input type="text" name="name" required>
                    </div>
                    <div class="form-group">
                        <label data-i18n="labelAge">العمر *</label>
                        <input type="number" name="age" required>
                    </div>
                    <div class="form-group">
                        <label data-i18n="labelPhone">رقم الهاتف / واتساب *</label>
                        <input type="tel" name="phone" required>
                    </div>
                    <div class="form-group">
                        <label data-i18n="labelEmail">البريد الإلكتروني</label>
                        <input type="email" name="email">
                    </div>
                </div>

                <div class="form-group">
                    <label data-i18n="labelSessionType">نوع الجلسة *</label>
                    <select name="session_type" required>
                        <option value="online" data-i18n="optionOnline">أونلاين عبر الواتساب</option>
                        <option value="in_person" data-i18n="optionInPerson">حضوري</option>
                    </select>
                </div>

                <div class="form-group">
                    <label data-i18n="labelDetails">وصف مختصر للصعوبة أو الطلب الحالي *</label>
                    <textarea name="description" rows="4" required></textarea>
                </div>

                <button type="submit" class="submit-btn" data-i18n="btnSubmit">إرسال طلب الحجز</button>
            </form>
        </section>
    </div>

    <script>
        // آلية تبديل الخلفيات تلقائياً كل 7 ثوانٍ
        const slides = document.querySelectorAll('.bg-slide');
        let currentSlide = 0;

        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }
        setInterval(nextSlide, 7000);

        // آلية اللغات
        const translations = {
            ar: {
                pageTitle: "حجز جلسة - أخصائية نفسية",
                heroTitle: "أهلاً بك في فضائك الآمن للاستماع والدعم",
                heroSubtitle: "أرافقك بكل لطف في فهم نفسك وما تمر به.",
                formTitle: "حجز جلسة",
                formDesc: "يُرجى تعبئة الاستمارة أدناه لإرسال طلب الحجز، وسيتصل بكم فريقنا لتأكيد حجزكم.",
                labelName: "الاسم واللقب *",
                labelAge: "العمر *",
                labelPhone: "رقم الهاتف / واتساب *",
                labelEmail: "البريد الإلكتروني",
                labelSessionType: "نوع الجلسة *",
                optionOnline: "أونلاين عبر الواتساب",
                optionInPerson: "حضوري",
                labelDetails: "وصف مختصر للصعوبة أو الطلب الحالي *",
                btnSubmit: "إرسال طلب الحجز"
            },
            en: {
                pageTitle: "Book a Session - Psychologist",
                heroTitle: "Welcome to your safe space for listening and support",
                heroSubtitle: "I gently accompany you in understanding yourself and what you are going through.",
                formTitle: "Book a Session",
                formDesc: "Please fill out the form below to submit your booking request. Our team will contact you to confirm.",
                labelName: "Full Name *",
                labelAge: "Age *",
                labelPhone: "Phone Number / WhatsApp *",
                labelEmail: "Email",
                labelSessionType: "Session Type *",
                optionOnline: "Online via WhatsApp",
                optionInPerson: "In-Person",
                labelDetails: "Brief description of the difficulty or current request *",
                btnSubmit: "Submit Booking Request"
            },
            fr: {
                pageTitle: "Réserver une séance - Psychologue",
                heroTitle: "Bienvenue dans votre espace d'écoute et de bienveillance",
                heroSubtitle: "Je vous accompagne avec bienveillance dans la compréhension de vous-même.",
                formTitle: "Réserver une séance",
                formDesc: "Veuillez remplir le formulaire ci-dessous. Notre équipe vous contactera pour confirmer votre rendez-vous.",
                labelName: "Nom et prénom *",
                labelAge: "Âge *",
                labelPhone: "Numéro de téléphone / WhatsApp *",
                labelEmail: "E-mail",
                labelSessionType: "Type de séance *",
                optionOnline: "En ligne (WhatsApp)",
                optionInPerson: "Présentiel",
                labelDetails: "Brève description de la difficulté ou de la demande *",
                btnSubmit: "Envoyer ma demande"
            },
            es: {
                pageTitle: "Reservar una sesión - Psicóloga",
                heroTitle: "Bienvenido a tu espacio seguro de escucha y apoyo",
                heroSubtitle: "Te acompaño con amabilidad a comprenderte a ti mismo y lo que estás pasando.",
                formTitle: "Reservar una sesión",
                formDesc: "Complete el siguiente formulario. Nuestro equipo se comunicará con usted para confirmar su cita.",
                labelName: "Nombre completo *",
                labelAge: "Edad *",
                labelPhone: "Número de teléfono / WhatsApp *",
                labelEmail: "Correo electrónico",
                labelSessionType: "Tipo de sesión *",
                optionOnline: "En línea (WhatsApp)",
                optionInPerson: "Presencial",
                labelDetails: "Breve descripción de la dificultad o solicitud *",
                btnSubmit: "Enviar solicitud de reserva"
            }
        };

        function changeLanguage(lang) {
            if (lang === 'ar') {
                document.documentElement.setAttribute('dir', 'rtl');
            } else {
                document.documentElement.setAttribute('dir', 'ltr');
            }
            document.documentElement.setAttribute('lang', lang);

            const elements = document.querySelectorAll('[data-i18n]');
            elements.forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });
        }
    </script>
</body>
</html>
