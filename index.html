<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pageTitle">حجز جلسة - أخصائية نفسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fcf9f8;
            --primary-color: #9c6f70;
            --secondary-color: #e5d1d0;
            --text-main: #4a3f3e;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            transition: all 0.3s ease;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* تنسيق شريط اختيار اللغة */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .lang-select {
            padding: 8px 15px;
            border: 1px solid var(--primary-color);
            border-radius: 20px;
            background-color: white;
            color: var(--primary-color);
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            cursor: pointer;
            outline: none;
        }

        .hero {
            text-align: center;
            padding: 50px 20px;
            background-color: var(--secondary-color);
            border-radius: 20px;
            margin-bottom: 40px;
        }

        .hero h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 1.1em;
            color: #6d5b5a;
        }

        .booking-section {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .booking-section h2 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: 'Cairo', sans-serif;
            background-color: #fafafa;
            box-sizing: border-box;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: #fff;
        }

        .submit-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 30px;
            width: 100%;
            font-size: 1.1em;
            font-family: 'Cairo', sans-serif;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .submit-btn:hover {
            background-color: #835b5c;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- شريط تغيير اللغة -->
        <div class="top-bar">
            <select class="lang-select" onchange="changeLanguage(this.value)">
                <option value="ar">العربية</option>
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="es">Español</option>
            </select>
        </div>

        <header class="hero">
            <h1 data-i18n="heroTitle">أهلاً بك في فضائك الآمن للاستماع والدعم</h1>
            <p data-i18n="heroSubtitle">أرافقك بكل لطف في فهم نفسك وما تمر به.</p>
        </header>

        <section class="booking-section">
            <h2 data-i18n="formTitle">حجز جلسة</h2>
            <p style="text-align: center; margin-bottom: 30px;" data-i18n="formDesc">يُرجى تعبئة الاستمارة أدناه لإرسال طلب الحجز، وسيتصل بكم فريقنا لتأكيد حجزكم.</p>
            
            <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
                <div class="form-grid">
                    <div class="form-group">
                        <label data-i18n="labelName">الاسم واللقب *</label>
                        <input type="text" name="name" required>
                    </div>
                    <div class="form-group">
                        <label data-i18n="labelAge">العمر *</label>
                        <input type="number" name="age" required>
                    </div>
                    <div class="form-group">
                        <label data-i18n="labelPhone">رقم الهاتف / واتساب *</label>
                        <input type="tel" name="phone" required>
                    </div>
                    <div class="form-group">
                        <label data-i18n="labelEmail">البريد الإلكتروني</label>
                        <input type="email" name="email">
                    </div>
                </div>

                <div class="form-group">
                    <label data-i18n="labelSessionType">نوع الجلسة *</label>
                    <select name="session_type" required>
                        <option value="online" data-i18n="optionOnline">أونلاين عبر الواتساب</option>
                        <option value="in_person" data-i18n="optionInPerson">حضوري</option>
                    </select>
                </div>

                <div class="form-group">
                    <label data-i18n="labelDetails">وصف مختصر للصعوبة أو الطلب الحالي *</label>
                    <textarea name="description" rows="4" required></textarea>
                </div>

                <button type="submit" class="submit-btn" data-i18n="btnSubmit">إرسال طلب الحجز</button>
            </form>
        </section>
    </div>

    <!-- كود الجافاسكربت للترجمة -->
    <script>
        const translations = {
            ar: {
                pageTitle: "حجز جلسة - أخصائية نفسية",
                heroTitle: "أهلاً بك في فضائك الآمن للاستماع والدعم",
                heroSubtitle: "أرافقك بكل لطف في فهم نفسك وما تمر به.",
                formTitle: "حجز جلسة",
                formDesc: "يُرجى تعبئة الاستمارة أدناه لإرسال طلب الحجز، وسيتصل بكم فريقنا لتأكيد حجزكم.",
                labelName: "الاسم واللقب *",
                labelAge: "العمر *",
                labelPhone: "رقم الهاتف / واتساب *",
                labelEmail: "البريد الإلكتروني",
                labelSessionType: "نوع الجلسة *",
                optionOnline: "أونلاين عبر الواتساب",
                optionInPerson: "حضوري",
                labelDetails: "وصف مختصر للصعوبة أو الطلب الحالي *",
                btnSubmit: "إرسال طلب الحجز"
            },
            en: {
                pageTitle: "Book a Session - Psychologist",
                heroTitle: "Welcome to your safe space for listening and support",
                heroSubtitle: "I gently accompany you in understanding yourself and what you are going through.",
                formTitle: "Book a Session",
                formDesc: "Please fill out the form below to submit your booking request. Our team will contact you to confirm.",
                labelName: "Full Name *",
                labelAge: "Age *",
                labelPhone: "Phone Number / WhatsApp *",
                labelEmail: "Email",
                labelSessionType: "Session Type *",
                optionOnline: "Online via WhatsApp",
                optionInPerson: "In-Person",
                labelDetails: "Brief description of the difficulty or current request *",
                btnSubmit: "Submit Booking Request"
            },
            fr: {
                pageTitle: "Réserver une séance - Psychologue",
                heroTitle: "Bienvenue dans votre espace d'écoute et de bienveillance",
                heroSubtitle: "Je vous accompagne avec bienveillance dans la compréhension de vous-même.",
                formTitle: "Réserver une séance",
                formDesc: "Veuillez remplir le formulaire ci-dessous. Notre équipe vous contactera pour confirmer votre rendez-vous.",
                labelName: "Nom et prénom *",
                labelAge: "Âge *",
                labelPhone: "Numéro de téléphone / WhatsApp *",
                labelEmail: "E-mail",
                labelSessionType: "Type de séance *",
                optionOnline: "En ligne (WhatsApp)",
                optionInPerson: "Présentiel",
                labelDetails: "Brève description de la difficulté ou de la demande *",
                btnSubmit: "Envoyer ma demande"
            },
            es: {
                pageTitle: "Reservar una sesión - Psicóloga",
                heroTitle: "Bienvenido a tu espacio seguro de escucha y apoyo",
                heroSubtitle: "Te acompaño con amabilidad a comprenderte a ti mismo y lo que estás pasando.",
                formTitle: "Reservar una sesión",
                formDesc: "Complete el siguiente formulario. Nuestro equipo se comunicará con usted para confirmar su cita.",
                labelName: "Nombre completo *",
                labelAge: "Edad *",
                labelPhone: "Número de teléfono / WhatsApp *",
                labelEmail: "Correo electrónico",
                labelSessionType: "Tipo de sesión *",
                optionOnline: "En línea (WhatsApp)",
                optionInPerson: "Presencial",
                labelDetails: "Breve descripción de la dificultad o solicitud *",
                btnSubmit: "Enviar solicitud de reserva"
            }
        };

        function changeLanguage(lang) {
            // تغيير اتجاه الصفحة حسب اللغة
            if (lang === 'ar') {
                document.documentElement.setAttribute('dir', 'rtl');
            } else {
                document.documentElement.setAttribute('dir', 'ltr');
            }
            document.documentElement.setAttribute('lang', lang);

            // استبدال النصوص
            const elements = document.querySelectorAll('[data-i18n]');
            elements.forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });
        }
    </script>
</body>
</html>
