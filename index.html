<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pageTitle">Réserver une séance - Psychologue</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #9c6f70;
            --primary-hover: #835b5c;
            --secondary-color: rgba(245, 235, 234, 0.88);
            --text-main: #4a3f3e;
            --card-bg: rgba(255, 255, 255, 0.92);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            position: relative;
            background-color: #fcf9f8;
            overflow-x: hidden;
            transition: all 0.3s ease;
        }

        .bg-static {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 120vh;
            background-image: url('3.jpg');
            background-size: cover;
            background-position: center top;
            z-index: -2;
            will-change: transform;
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, rgba(252, 249, 248, 0.45), rgba(243, 230, 229, 0.40));
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            z-index: -1;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 25px 20px 60px;
            position: relative;
            z-index: 1;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 25px;
        }

        html[dir="ltr"] .top-bar {
            justify-content: flex-end;
        }

        .lang-select {
            padding: 9px 18px;
            border: 1px solid var(--primary-color);
            border-radius: 25px;
            background-color: rgba(255, 255, 255, 0.95);
            color: var(--primary-color);
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            cursor: pointer;
            outline: none;
            box-shadow: 0 4px 12px rgba(156, 111, 112, 0.12);
            transition: all 0.3s ease;
        }

        .lang-select:hover {
            background-color: #fff;
            transform: translateY(-1px);
        }

        .hero {
            text-align: center;
            padding: 45px 25px;
            background-color: var(--secondary-color);
            border-radius: 24px;
            margin-bottom: 35px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .hero h1 {
            color: var(--primary-color);
            margin: 0 0 12px;
            font-size: 1.9em;
            line-height: 1.4;
        }

        .hero p {
            font-size: 1.15em;
            color: #6d5b5a;
            margin: 0;
        }

        .booking-section {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        .booking-section h2 {
            color: var(--primary-color);
            text-align: center;
            margin: 0 0 15px;
            font-size: 1.7em;
        }

        .booking-section .section-desc {
            text-align: center;
            margin-bottom: 35px;
            color: #7a6a69;
            font-size: 1.05em;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #554443;
        }

        /* تنسيق علامة الإجباري والاختياري */
        .req-mark {
            color: #c48c8e; /* لون خفيف عملي ومتناسق */
            font-weight: bold;
            margin: 0 4px;
        }

        .optional-text {
            color: #999999;
            font-size: 0.85em;
            font-weight: normal;
            margin: 0 4px;
        }

        /* إخفاء الحقول الديناميكية */
        .hidden {
            display: none !important;
        }

        .form-group input, 
        .form-group select {
            width: 100%;
            padding: 13px 16px;
            border: 1.5px solid #ecdcdb;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            background-color: rgba(255, 255, 255, 0.85);
            font-size: 0.95em;
            color: var(--text-main);
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .form-group textarea {
            width: 100%;
            padding: 13px 16px;
            border: 1.5px solid #ecdcdb;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            background-color: rgba(255, 255, 255, 0.85);
            font-size: 0.95em;
            color: var(--text-main);
            transition: border-color 0.25s, box-shadow 0.25s;
            resize: none; 
            height: 160px; 
        }

        .form-group input:focus, 
        .form-group textarea:focus, 
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(156, 111, 112, 0.12);
        }

        .submit-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 16px 30px;
            width: 100%;
            font-size: 1.15em;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(156, 111, 112, 0.25);
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(156, 111, 112, 0.35);
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
                gap: 0;
            }
            .booking-section {
                padding: 25px 20px;
            }
            .hero {
                padding: 30px 15px;
            }
            .hero h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>

    <div class="bg-static"></div>
    <div class="bg-overlay"></div>

    <div class="container">
        <div class="top-bar">
            <select class="lang-select" onchange="changeLanguage(this.value)">
                <option value="fr">Français</option>
                <option value="ar">العربية</option>
                <option value="en">English</option>
                <option value="es">Español</option>
            </select>
        </div>

        <header class="hero">
            <h1 data-i18n="heroTitle">Bienvenue dans votre espace d'écoute et de bienveillance</h1>
            <p data-i18n="heroSubtitle">Je vous accompagne avec bienveillance dans la compréhension de vous-même.</p>
        </header>

        <section class="booking-section">
            <h2 data-i18n="formTitle">Réserver une séance</h2>
            <p class="section-desc" data-i18n="formDesc">Veuillez remplir le formulaire ci-dessous. Notre équipe vous contactera pour confirmer votre rendez-vous.</p>
            
            <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
                <div class="form-grid">
                    <!-- الحقول الإجبارية -->
                    <div class="form-group">
                        <label><span data-i18n="labelName">Nom et prénom</span><span class="req-mark">*</span></label>
                        <input type="text" name="name" required>
                    </div>
                    <div class="form-group">
                        <label><span data-i18n="labelAge">Âge</span><span class="req-mark">*</span></label>
                        <input type="number" name="age" required>
                    </div>
                    <div class="form-group">
                        <label><span data-i18n="labelPhone">Numéro de téléphone / WhatsApp</span><span class="req-mark">*</span></label>
                        <input type="tel" name="phone" required>
                    </div>
                    <div class="form-group">
                        <label><span data-i18n="labelSessionType">Type de séance</span><span class="req-mark">*</span></label>
                        <select name="session_type" required>
                            <option value="online" data-i18n="optionOnline">En ligne (WhatsApp)</option>
                            <option value="in_person" data-i18n="optionInPerson">Présentiel</option>
                        </select>
                    </div>

                    <!-- الحقول الاختيارية -->
                    <div class="form-group">
                        <label><span data-i18n="labelEmail">E-mail</span><span class="optional-text" data-i18n="optional">(Optionnel)</span></label>
                        <input type="email" name="email">
                    </div>
                    
                    <!-- حقول السكن الديناميكية -->
                    <div class="form-group">
                        <label><span data-i18n="labelCountry">Pays</span><span class="optional-text" data-i18n="optional">(Optionnel)</span></label>
                        <input type="text" name="country" id="countryInput">
                    </div>
                    <div class="form-group hidden" id="cityGroup">
                        <label><span data-i18n="labelCity">Ville</span><span class="optional-text" data-i18n="optional">(Optionnel)</span></label>
                        <input type="text" name="city" id="cityInput">
                    </div>
                    <div class="form-group hidden" id="regionGroup">
                        <label><span data-i18n="labelRegion">État ou Région</span><span class="optional-text" data-i18n="optional">(Optionnel)</span></label>
                        <input type="text" name="region" id="regionInput">
                    </div>
                </div>

                <!-- الوصف (خارج الشبكة ليكون بعرض الشاشة الكامل) -->
                <div class="form-group">
                    <label><span data-i18n="labelDetails">Brève description de la difficulté ou de la demande</span><span class="optional-text" data-i18n="optional">(Optionnel)</span></label>
                    <textarea name="description"></textarea>
                </div>

                <button type="submit" class="submit-btn" data-i18n="btnSubmit">Envoyer ma demande</button>
            </form>
        </section>
    </div>

    <script>
        // تأثير الحركة الانسيابية للخلفية
        window.addEventListener('scroll', function() {
            const scrolled = window.scrollY;
            const bg = document.querySelector('.bg-static');
            bg.style.transform = `translateY(-${scrolled * 0.25}px)`;
        });

        // ديناميكية حقول السكن (تظهر بالتتابع عند الكتابة)
        const countryInput = document.getElementById('countryInput');
        const cityGroup = document.getElementById('cityGroup');
        const cityInput = document.getElementById('cityInput');
        const regionGroup = document.getElementById('regionGroup');
        const regionInput = document.getElementById('regionInput');

        countryInput.addEventListener('input', function() {
            if(this.value.trim().length > 0) {
                cityGroup.classList.remove('hidden');
            } else {
                cityGroup.classList.add('hidden');
                regionGroup.classList.add('hidden');
                cityInput.value = '';
                regionInput.value = '';
            }
        });

        cityInput.addEventListener('input', function() {
            if(this.value.trim().length > 0) {
                regionGroup.classList.remove('hidden');
            } else {
                regionGroup.classList.add('hidden');
                regionInput.value = '';
            }
        });

        // القاموس الشامل لكل اللغات
        const translations = {
            ar: {
                pageTitle: "حجز جلسة - أخصائية نفسية",
                heroTitle: "أهلاً بك في فضائك الآمن للاستماع والدعم",
                heroSubtitle: "أرافقك بكل لطف في فهم نفسك وما تمر به.",
                formTitle: "حجز جلسة",
                formDesc: "يُرجى تعبئة الاستمارة أدناه لإرسال طلب الحجز، وسيتصل بكم فريقنا لتأكيد حجزكم.",
                labelName: "الاسم واللقب",
                labelAge: "العمر",
                labelPhone: "رقم الهاتف / واتساب",
                labelSessionType: "نوع الجلسة",
                optionOnline: "أونلاين عبر الواتساب",
                optionInPerson: "حضوري",
                labelEmail: "البريد الإلكتروني",
                labelCountry: "البلد",
                labelCity: "المدينة",
                labelRegion: "الولاية أو المنطقة",
                labelDetails: "وصف مختصر للصعوبة أو الطلب الحالي",
                btnSubmit: "إرسال طلب الحجز",
                optional: "(اختياري)"
            },
            en: {
                pageTitle: "Book a Session - Psychologist",
                heroTitle: "Welcome to your safe space for listening and support",
                heroSubtitle: "I gently accompany you in understanding yourself and what you are going through.",
                formTitle: "Book a Session",
                formDesc: "Please fill out the form below to submit your booking request. Our team will contact you to confirm.",
                labelName: "Full Name",
                labelAge: "Age",
                labelPhone: "Phone Number / WhatsApp",
                labelSessionType: "Session Type",
                optionOnline: "Online via WhatsApp",
                optionInPerson: "In-Person",
                labelEmail: "Email",
                labelCountry: "Country",
                labelCity: "City",
                labelRegion: "State or Region",
                labelDetails: "Brief description of the difficulty or current request",
                btnSubmit: "Submit Booking Request",
                optional: "(Optional)"
            },
            fr: {
                pageTitle: "Réserver une séance - Psychologue",
                heroTitle: "Bienvenue dans votre espace d'écoute et de bienveillance",
                heroSubtitle: "Je vous accompagne avec bienveillance dans la compréhension de vous-même.",
                formTitle: "Réserver une séance",
                formDesc: "Veuillez remplir le formulaire ci-dessous. Notre équipe vous contactera pour confirmer votre rendez-vous.",
                labelName: "Nom et prénom",
                labelAge: "Âge",
                labelPhone: "Numéro de téléphone / WhatsApp",
                labelSessionType: "Type de séance",
                optionOnline: "En ligne (WhatsApp)",
                optionInPerson: "Présentiel",
                labelEmail: "E-mail",
                labelCountry: "Pays",
                labelCity: "Ville",
                labelRegion: "État ou Région",
                labelDetails: "Brève description de la difficulté ou de la demande",
                btnSubmit: "Envoyer ma demande",
                optional: "(Optionnel)"
            },
            es: {
                pageTitle: "Reservar una sesión - Psicóloga",
                heroTitle: "Bienvenido a tu espacio seguro de escucha y apoyo",
                heroSubtitle: "Te acompaño con amabilidad a comprenderte a ti mismo y lo que estás pasando.",
                formTitle: "Reservar una sesión",
                formDesc: "Complete el siguiente formulario. Nuestro equipo se comunicará con usted para confirmar su cita.",
                labelName: "Nombre completo",
                labelAge: "Edad",
                labelPhone: "Número de teléfono / WhatsApp",
                labelSessionType: "Tipo de sesión",
                optionOnline: "En línea (WhatsApp)",
                optionInPerson: "Presencial",
                labelEmail: "Correo electrónico",
                labelCountry: "País",
                labelCity: "Ciudad",
                labelRegion: "Estado o Región",
                labelDetails: "Breve descripción de la dificultad o solicitud",
                btnSubmit: "Enviar solicitud de reserva",
                optional: "(Opcional)"
            }
        };

        // دالة تغيير اللغة
        function changeLanguage(lang) {
            if (lang === 'ar') {
                document.documentElement.setAttribute('dir', 'rtl');
            } else {
                document.documentElement.setAttribute('dir', 'ltr');
            }
            document.documentElement.setAttribute('lang', lang);
            document.querySelector('.lang-select').value = lang;

            const elements = document.querySelectorAll('[data-i18n]');
            elements.forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });
        }

        // كشف لغة الجهاز تلقائياً
        document.addEventListener("DOMContentLoaded", function() {
            const userLang = (navigator.language || navigator.userLanguage).substring(0, 2).toLowerCase();
            const supportedLangs = ['ar', 'en', 'fr', 'es'];
            const finalLang = supportedLangs.includes(userLang) ? userLang : 'fr';
            changeLanguage(finalLang);
        });
    </script>
</body>
</html>
